name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cloudflare Pages handles deployment. This workflow only verifies that what
# lands on a branch actually builds, so a broken commit is caught before Pages
# tries to deploy it.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, types, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        # Version comes from `packageManager` in the root package.json.

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Type-check (astro check)
        run: pnpm check

      - name: Build
        run: pnpm build
